# Conda environment for running STeP's LIBERO / LIBERO-Pro rollouts on a
# cluster (e.g. UMIACS Nexus). Mirrors the dev machine's cap-x/.venv-libero
# (a uv-managed venv), rebuilt on conda so OMPL comes from conda-forge
# (a maintained build with correct libstdc++ handling) instead of the
# preload-shim hack the original uv venv needed.
#
# Create with:
#   conda env create -f cluster/environment.yml
# Then finish setup with cluster/setup_env.sh (editable installs of the
# cloned third-party repos + LIBERO-Pro perturbation data).
name: step-libero
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ompl               # motion planning; conda-forge build includes Python bindings
  - ffmpeg             # required by imageio-ffmpeg for --save-video
  - pip
  - pip:
      - -r requirements-libero.txt
